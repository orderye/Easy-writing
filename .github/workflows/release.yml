name: Release Easy-writing

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式：build-only 只构建验证不发布；release-tag 发布指定 tag'
        required: true
        type: choice
        default: build-only
        options:
          - build-only
          - release-tag
      tag:
        description: '正式发布的目标 tag（release-tag 模式必填，须为仓库中已存在的 vMAJOR.MINOR.PATCH）'
        required: false
        type: string

jobs:
  # V0.3.8 P1-5：发布门禁。
  #
  # 原来的版本校验步骤带着 `if: startsWith(github.ref, 'refs/tags/')`，
  # 于是 workflow_dispatch 从 main 手动触发时整段校验被跳过，
  # 紧接着 tauri-action 用 `tagName: ${{ github.ref_name }}` 创建 Release ——
  # 产出一个名为「Easy-writing main」、tag 为 main 的正式发布产物。
  #
  # 现在改为：门禁无条件运行，判定逻辑在 scripts/release-gate.mjs 里（有测试），
  # 后续所有 job 的 tag / 检出 ref / 是否发布都由门禁的输出唯一决定。
  gate:
    name: 发布门禁
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.gate.outputs.release_tag }}
      is_release: ${{ steps.gate.outputs.is_release }}
      checkout_ref: ${{ steps.gate.outputs.checkout_ref }}
    steps:
      # fetch-depth: 0 是必需的 —— 门禁要验证「指定的 tag 在仓库中真实存在」，
      # 默认的浅克隆不带 tag。
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve release intent (branch names can never become a release tag)
        id: gate
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: node scripts/release-gate.mjs

      # 版本一致性必须针对**将要被构建的那份内容**校验。
      # 手动触发时触发 ref 是分支，而构建 ref 是 tag —— 少了这一步检出，
      # 就会拿分支上的版本号去为 tag 背书。
      - name: Checkout the exact ref that will be built
        if: steps.gate.outputs.is_release == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Verify version consistency
        run: |
          if [ "${{ steps.gate.outputs.is_release }}" = "true" ]; then
            # 正式发布：tag 必须与构建版本一致，且 CHANGELOG 必须有对应条目
            node scripts/check-version.mjs --tag "${{ steps.gate.outputs.release_tag }}" --strict
          else
            # build-only：仍然校验 6 处版本字段自洽，只是不绑定 tag
            node scripts/check-version.mjs
          fi

  release:
    name: 构建与发布
    needs: gate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          # 任务书 T14：新增 macOS Intel 构建（与 aarch64 并列，产物各自独立）。
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.checkout_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # pnpm 版本由 package.json 的 packageManager 字段唯一确定；
      # 这里不要再写 version，否则与 packageManager 冲突会导致 action 报错。
      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        uses: baptiste0928/cargo-install@v3
        with:
          crate: trunk

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend bridge and styles
        run: pnpm build:assets

      # 发布前必须跑测试：发布流程如果绕开 CI，等于把未验证的包直接推给用户。
      - name: Run tests
        run: pnpm test

      # macOS DMG 打包实测出现过瞬时失败（同一段代码，首次 bundle_dmg.sh 失败，
      # 清掉它遗留的挂载卷与 rw.*.dmg 后重跑就成功）。
      # 这里在构建前先把这类残留清掉，避免上一次失败污染本次尝试。
      - name: Clean stale DMG artifacts (macOS only)
        if: runner.os == 'macOS'
        run: |
          find target -type f -name 'rw.*.Easy-writing_*.dmg' -delete 2>/dev/null || true
          while IFS= read -r line; do
            case "$line" in
              image-path*)
                img="$(printf '%s' "${line#*image-path}" | sed 's/^[[:space:]]*: //' | sed 's/^[[:space:]]*//')"
                case "$img" in
                  *"/target/"*rw.*.dmg) echo "卸载残留卷 $img"; hdiutil detach "$img" -force || true ;;
                esac
                ;;
            esac
          done < <(hdiutil info || true)

      # ---- macOS 签名与公证（任务书 T14）----
      #
      # 全部以 secret 是否配置为开关：未配置时整段跳过，CI 照常产出
      # 未签名包（README 写明首次打开方式），不失败。
      #
      # 需要人工在仓库 Settings → Secrets 配置（值不写入本文件）：
      #   APPLE_CERTIFICATE        base64 的 .p12 开发者证书
      #   APPLE_CERTIFICATE_PASSWORD  该 .p12 的导出密码
      #   APPLE_SIGNING_IDENTITY   证书名称（如 "Developer ID Application: ..."）
      #   APPLE_ID                 公证用 Apple ID（或改走 App Store Connect API key）
      #   APPLE_PASSWORD           公证用 app-specific password
      #   APPLE_TEAM_ID            开发者团队 ID
      # tauri-action 读取 APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD /
      # APPLE_TEAM_ID 完成构建期签名与公证；导入证书供 codesign 使用。
      - name: Import Apple signing certificate (macOS, optional)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        id: apple_cert
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$(openssl rand -hex 16)" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$(openssl rand -hex 16 2>/dev/null || echo dummy)" $KEYCHAIN_PATH || true
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$(security find-generic-password -s $KEYCHAIN_PATH >/dev/null 2>&1 && echo ignored || echo dummy)" -k dummy $KEYCHAIN_PATH >/dev/null 2>&1 || true
          security list-keychain -d user -s $KEYCHAIN_PATH login.keychain-db

      - name: Build and Publish Tauri Desktop App
        if: needs.gate.outputs.is_release == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS 签名与公证（任务书 T14）：secret 未配置时为空串，
          # tauri 构建器自动跳过签名，产物为未签名包 —— CI 不失败。
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows 代码签名（任务书 T14）：TAURI_SIGNING_* 走 tauri 内置
          # signtool 流程；未配置时同样为空、跳过签名。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.WINDOWS_SIGNING_PFX }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        with:
          # buildCommand 让构建走带重试的脚本（scripts/tauri-build-retry.sh）。
          # 注意：这一项的实际生效情况尚未在一次真实 CI 运行中确认过
          # （本地无法执行 GitHub Actions）。即使它没被采纳，退回默认构建
          # 也只是丢掉自动重试，不会产生错误产物 —— 见
          # Docs/V0.3.8_RELEASE_ACCEPTANCE.md 的「待验证项」。
          buildCommand: ./scripts/tauri-build-retry.sh ${{ matrix.args }}
          tagName: ${{ needs.gate.outputs.release_tag }}
          releaseName: 'Easy-writing ${{ needs.gate.outputs.release_tag }}'
          # 在代码签名与真机安装验收完成前，所有 tag 发布一律先落为 draft + prerelease，
          # 由维护者确认附件与验收结果后手动 publish。不要把这里改回 false：
          # 当前 CI 在未配置 secrets 时产出的是未签名、未公证安装包。
          releaseBody: |
            **draft / pre-release**：本版本产物未签名、未公证，macOS 与 Windows 的安装验收尚未执行。
            请勿将其作为「可靠性修复已全部验证完成」的正式版分发；详情见仓库发布说明。
            下载后请用 `SHA256SUMS.txt` 校验安装包。
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

      # 校验和（任务书 T13）：为 Release 全部附件生成 SHA256SUMS.txt 并上传。
      # 必须在两个矩阵平台**都跑完**之后执行一次，否则会互相覆盖同一份文件，
      # 因此放在单独的 gather job（见下方）。

      # ---- Windows 代码签名（任务书 T14）----
      #
      # 以 WINDOWS_SIGNING_PFX 是否配置为开关；未配置时跳过，不失败。
      # PFX 以 base64 存于 secret；signtool 对 DMG 之外的 .msi/.exe 签名。
      - name: Sign Windows installers (optional)
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_PFX != ''
        env:
          WINDOWS_SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" |
            Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1).FullName
          if (-not $signtool) { Write-Error "signtool.exe not found"; exit 1 }
          Get-ChildItem -Path "target" -Recurse -Include *.msi, *.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'release\\bundle' } |
            ForEach-Object {
              Write-Host "Signing $($_.Name)"
              & $signtool sign /f $pfxPath /p "$env:WINDOWS_SIGNING_PFX_PASSWORD" /tr http://timestamp.digicert.com /td sha256 /fd sha256 $_.FullName
            }

      # build-only：只产出构建物供人工检查，绝不创建 Release。
      # 前端资源已在上一步构建完成，这里只跑 tauri build（macOS 走重试脚本）。
      - name: Build only (no release published) — macOS with DMG retry
        if: needs.gate.outputs.is_release != 'true' && runner.os == 'macOS'
        run: ./scripts/tauri-build-retry.sh ${{ matrix.args }}

      - name: Build only (no release published) — other platforms
        if: needs.gate.outputs.is_release != 'true' && runner.os != 'macOS'
        run: pnpm tauri build ${{ matrix.args }}

  # 校验和汇总（任务书 T13）：等全平台产物都上传完后，为 Release 附件
  # 生成一份 SHA256SUMS.txt 再传回去。应用内更新提示（check_app_update）
  # 会读取这份文件，把每个安装包的 SHA-256 展示给作者核对。
  #
  # 放在单独 job 而不是矩阵内：两个平台并行执行会各自上传同名文件互相覆盖，
  # 只有一份覆盖了全部产物的校验和文件才有意义。
  checksums:
    name: 生成并上传 SHA256SUMS
    needs: [gate, release]
    if: needs.gate.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          gh release download "${{ needs.gate.outputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --dir release-assets \
            --clobber

      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        # 校验和文件的行格式：<sha256>  <filename>（两个空格 + 相对文件名），
        # 与 shasum -a 256 / sha256sum 的默认输出一致，可被 `sha256sum -c` 直接校验。
        run: |
          sha256sum --binary * > SHA256SUMS.txt
          echo "---- SHA256SUMS.txt ----"
          cat SHA256SUMS.txt

      - name: Upload SHA256SUMS.txt to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --clobber：重跑发布流程时覆盖旧校验和，而不是报错中断
          gh release upload "${{ needs.gate.outputs.release_tag }}" \
            release-assets/SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --clobber
