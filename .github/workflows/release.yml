name: Release Easy-writing

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # pnpm 版本由 package.json 的 packageManager 字段唯一确定；
      # 这里不要再写 version，否则与 packageManager 冲突会导致 action 报错。
      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        uses: baptiste0928/cargo-install@v3
        with:
          crate: trunk

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend bridge and styles
        run: pnpm build:assets

      # 发布门禁：tag 必须与构建配置里的版本号一致。
      # 少了这一步，推 v0.3.9 的 tag 而 tauri.conf.json 还是 0.3.7 时，
      # 发布会照常成功，只是产出一个版本号错乱的安装包。
      - name: Verify tag matches build version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-version.mjs --tag "${{ github.ref_name }}" --strict

      # 发布前必须跑测试：发布流程如果绕开 CI，等于把未验证的包直接推给用户。
      - name: Run tests
        run: pnpm test

      - name: Build and Publish Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Easy-writing ${{ github.ref_name }}'
          releaseBody: 'Easy-writing 小说工作台双端正式发布版本（支持 macOS 与 Windows）'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
