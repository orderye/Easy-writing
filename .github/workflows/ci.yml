name: CI

# 之前的仓库只有 release.yml（tag push 才触发），普通 commit / PR 完全没有机器验证。
# 这个工作流是"每次改动都必须过"的那道门。
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # V0.3.8 P0-3：版本一致性门禁。
  # 版本字段散落在 5 个文件里，全靠人工同步，漏改不会有任何报错。
  # 这个 job 把它固化成可执行检查，且刻意放在最前面 —— 版本错了，
  # 后面所有构建与测试的结论都无意义。
  version:
    name: 版本一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check version fields agree across manifest / Cargo / tauri.conf
        run: node scripts/check-version.mjs

  frontend:
    name: 前端（依赖护栏 + 桥接测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # pnpm 版本由 package.json 的 packageManager 字段唯一确定，此处不再写 version，
      # 避免与 packageManager 冲突导致 action 直接报错。
      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend bridge and styles
        run: pnpm build:assets

      - name: Frontend tests（含 Tiptap 依赖护栏）
        run: pnpm test:frontend

  backend:
    name: 后端（IPC 契约 + 数据层）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # 只测桌面后端 crate。workspace 里的 frontend 是 leptos CSR（仅面向 wasm32），
      # 用 --workspace 会把它拉进来为宿主目标白白编译一遍（跑 0 个测试）。
      - name: Backend tests
        run: cargo test -p easy-writing-core -p easy-writing-frontend

  # V0.3.8 P1-1：真实 WebDAV 服务端集成测试。
  #
  # tests/webdav_integration.rs 用的是仓库自带的进程内测试服务端（随 backend job 运行），
  # 它能证明客户端发出的请求符合 WebDAV 语义，但证明不了与真实产品的兼容性。
  # 本 job 跑在真实 WebDAV 服务端上，补的正是这一层。
  #
  # 服务端选型记录（任务书 P1-1 B 要求）：
  #   镜像        bytemark/webdav:2.4（固定标签，不用 latest）
  #   实现        nginx + ngx_http_dav_module + nginx-dav-ext-module
  #   支持方法    PROPFIND(Depth 0/1) / GET / HEAD / PUT / MOVE / DELETE / MKCOL / OPTIONS
  #               —— 与 WebDavClient 实际发出的请求集合一致
  #   认证        HTTP Basic（AUTH_TYPE=basic + USERNAME/PASSWORD）
  #   测试目录    每次运行由测试自身用 MKCOL 创建独占子目录（ew-it-<pid>-<纳秒>），
  #               结束时只删除该目录下由本测试创建的文件
  #   凭据        ewtest/ewtest，仅存在于这个一次性容器内，不是任何生产账号
  #
  # 关键约束：EW_WEBDAV_IT_* 一旦设置，服务端不可达就是**失败**而不是跳过。
  # 容器起不来、健康检查不过，这个 job 必须是红的 —— 不允许用「跳过」冒充通过。
  webdav:
    name: WebDAV 集成（真实服务端）
    runs-on: ubuntu-latest
    services:
      webdav:
        image: bytemark/webdav:2.4
        env:
          AUTH_TYPE: basic
          USERNAME: ewtest
          PASSWORD: ewtest
        ports:
          - 8080:80
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev build-essential curl wget file

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # 显式等待：service container 的端口映射就绪不等于 WebDAV 已能应答。
      # 探测用的就是客户端真正依赖的 PROPFIND，而不是 TCP 连通性。
      - name: Wait for WebDAV service (PROPFIND probe)
        run: |
          for i in $(seq 1 30); do
            if curl -sf -u ewtest:ewtest -X PROPFIND -H 'Depth: 0' \
                 -H 'Content-Type: application/xml' \
                 --data '<?xml version="1.0"?><D:propfind xmlns:D="DAV:"><D:prop><D:resourcetype/></D:prop></D:propfind>' \
                 http://127.0.0.1:8080/ >/dev/null; then
              echo "WebDAV 服务端就绪（第 ${i} 次探测）"
              exit 0
            fi
            sleep 2
          done
          echo "WebDAV 服务端未就绪，判定为失败（不跳过）" >&2
          exit 1

      - name: Run real-server WebDAV integration tests
        env:
          EW_WEBDAV_IT_URL: http://127.0.0.1:8080/
          EW_WEBDAV_IT_USER: ewtest
          EW_WEBDAV_IT_PASSWORD: ewtest
        run: |
          cargo test -p easy-writing-core --test webdav_real_server -- \
            --nocapture --test-threads=1 2>&1 | tee webdav-it.log
          # 日志脱敏护栏：凭据不得出现在留存的日志里。
          if grep -q 'ewtest:ewtest\|EW_WEBDAV_IT_PASSWORD=' webdav-it.log; then
            echo "日志中出现明文凭据" >&2
            exit 1
          fi

      - name: Upload integration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webdav-integration-log
          path: webdav-it.log
          if-no-files-found: warn

  # V0.3.8 P1-1：性能门禁。
  #
  # 阈值刻意宽松（500ms）。理由：CI runner 的 CPU 与开发机差异很大，
  # 我们没有在 runner 上采集过真实分布，任何更紧的阈值都会产生噪音，
  # 最终导致大家养成忽略红色构建的习惯。
  # 这个门槛只用于拦截「劣化一个数量级」的回归（如误引入 N+1），
  # 精确的性能治理以本机定期跑出的报告为准。
  performance:
    name: 性能门禁（长篇基准）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev build-essential curl wget file

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run long-novel performance benchmarks with gate
        env:
          EW_PERF_GATE_MS: "500"
        run: cargo test -p easy-writing-core --test perf_benchmark -- --ignored --test-threads=1
