name: CI

# 之前的仓库只有 release.yml（tag push 才触发），普通 commit / PR 完全没有机器验证。
# 这个工作流是"每次改动都必须过"的那道门。
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: 前端（依赖护栏 + 桥接测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # pnpm 版本由 package.json 的 packageManager 字段唯一确定，此处不再写 version，
      # 避免与 packageManager 冲突导致 action 直接报错。
      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend bridge and styles
        run: pnpm build:assets

      - name: Frontend tests（含 Tiptap 依赖护栏）
        run: pnpm test:frontend

  backend:
    name: 后端（IPC 契约 + 数据层）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # 只测桌面后端 crate。workspace 里的 frontend 是 leptos CSR（仅面向 wasm32），
      # 用 --workspace 会把它拉进来为宿主目标白白编译一遍（跑 0 个测试）。
      - name: Backend tests
        run: pnpm test:backend
