name: CI

# 之前的仓库只有 release.yml（tag push 才触发），普通 commit / PR 完全没有机器验证。
# 这个工作流是"每次改动都必须过"的那道门。
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # V0.3.8 P0-3：版本一致性门禁。
  # 版本字段散落在 5 个文件里，全靠人工同步，漏改不会有任何报错。
  # 这个 job 把它固化成可执行检查，且刻意放在最前面 —— 版本错了，
  # 后面所有构建与测试的结论都无意义。
  version:
    name: 版本一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check version fields agree across manifest / Cargo / tauri.conf
        run: node scripts/check-version.mjs

  # 文档 Schema 护栏：校验《实施计划》§五 的表清单与 src-tauri/migrations/ 实际建表一致。
  # 《实施计划》§五 长期停在 V001 基线，而工程早已演进到 V003 ——
  # 迁移里加了表、文档没跟上时没有任何报错，直到有人照着文档写代码才踩坑。
  # 顺带把 scripts/ 下的测试纳入 CI：此前 CI 只跑 test:frontend，
  # test:scripts（版本门禁、发布门禁的测试）从未在 CI 上执行过。
  schema-docs:
    name: 文档 Schema 护栏
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check 实施计划 §五 与 migrations 表清单一致
        run: node scripts/check-docs-schema.mjs

      - name: Script tests（含版本门禁、发布门禁、文档护栏）
        run: pnpm test:scripts

  frontend:
    name: 前端（依赖护栏 + 桥接测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # pnpm 版本由 package.json 的 packageManager 字段唯一确定，此处不再写 version，
      # 避免与 packageManager 冲突导致 action 直接报错。
      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend bridge and styles
        run: pnpm build:assets

      - name: Frontend tests（含 Tiptap 依赖护栏）
        run: pnpm test:frontend

  backend:
    name: 后端（IPC 契约 + 数据层）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # 只测桌面后端 crate。workspace 里的 frontend 是 leptos CSR（仅面向 wasm32），
      # 用 --workspace 会把它拉进来为宿主目标白白编译一遍（跑 0 个测试）。
      - name: Backend tests
        run: cargo test -p easy-writing-core -p easy-writing-frontend

  # V0.3.8 P1-1：真实 WebDAV 服务端集成测试。
  #
  # tests/webdav_integration.rs 用的是仓库自带的进程内测试服务端（随 backend job 运行），
  # 它能证明客户端发出的请求符合 WebDAV 语义，但证明不了与真实产品的兼容性。
  # 本 job 跑在真实 WebDAV 实现上，补的正是这一层。
  #
  # 服务端选型记录（任务书 P1-1 B 要求）：
  #   镜像        ghcr.io/hacdias/webdav（Go 实现，源码 github.com/hacdias/webdav）
  #   选择依据    上游 README 明确列出支持 PROPFIND / MKCOL / MOVE / COPY /
  #               DELETE / PUT / GET / HEAD —— 与 WebDavClient 实际发出的
  #               请求集合完全一致
  #   端口        6065
  #   认证        HTTP Basic（配置文件里声明单个测试用户）
  #   数据目录    每次运行用一次性容器 + runner 上的临时目录，
  #               测试自身再在其内创建 ew-it-<pid>-<纳秒> 独占子目录
  #   凭据        ewtest/ewtest，只存在于这个一次性容器，不是任何生产账号
  #
  # 为什么不用 `services:`：service 容器在所有 step 之前启动，
  # 而我需要先在 runner 上生成配置文件才能启动它 —— 顺序上做不到。
  # 改成在 step 里 `docker run -d`，配置与数据目录都由本 job 现造现抛。
  #
  # 关键约束（沿用上一版的设计，不因调试而放松）：
  #   设置了 EW_WEBDAV_IT_* 之后，服务端不可达就是**失败**而不是跳过。
  #
  # 调试说明：本 job 首次运行失败在探测步骤（当时选的是 bytemark/webdav，
  # 其源码仓库已 404、接口无法核实）。因此探测步骤现在会打印真实 HTTP 状态码
  # 与容器日志，让失败可诊断，而不是只留一句「未就绪」。
  webdav:
    name: WebDAV 集成（真实服务端）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev build-essential curl wget file

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Start real WebDAV server (hacdias/webdav)
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          mkdir -p "$WORK/data"
          cat > "$WORK/config.yml" <<'YAML'
          address: 0.0.0.0
          port: 6065
          directory: /data
          prefix: /
          tls: false
          cors:
            enabled: true
          users:
            - username: ewtest
              password: ewtest
              directory: /data
          YAML
          docker run -d --name ew-webdav \
            -p 6065:6065 \
            -v "$WORK/config.yml:/config.yml:ro" \
            -v "$WORK/data:/data" \
            ghcr.io/hacdias/webdav -c /config.yml
          echo "WEBDAV_WORKDIR=$WORK" >> "$GITHUB_ENV"

      # 探测用的是客户端真正依赖的 PROPFIND，而不是 TCP 连通性。
      # 失败时输出状态码与容器日志 —— 一次运行就能定位问题，不靠反复猜。
      - name: Wait for WebDAV service (PROPFIND probe)
        run: |
          set -uo pipefail
          ok=0
          for i in $(seq 1 30); do
            code="$(curl -s -o /tmp/propfind.out -w '%{http_code}' \
                     -u ewtest:ewtest -X PROPFIND -H 'Depth: 0' \
                     -H 'Content-Type: application/xml' \
                     --data '<?xml version="1.0"?><D:propfind xmlns:D="DAV:"><D:prop><D:resourcetype/></D:prop></D:propfind>' \
                     http://127.0.0.1:6065/ || echo 'curl-error')"
            echo "第 ${i} 次探测 PROPFIND / -> HTTP ${code}"
            if [ "$code" = "207" ] || [ "$code" = "200" ]; then
              echo "WebDAV 服务端就绪"
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "WebDAV 服务端未就绪，判定为失败（不跳过）" >&2
            echo "--- 最后一次响应体（截断至 400 字节）---" >&2
            head -c 400 /tmp/propfind.out >&2 || true
            echo "" >&2
            echo "--- 容器状态 ---" >&2
            docker ps -a --filter name=ew-webdav >&2 || true
            echo "--- 容器日志 ---" >&2
            docker logs ew-webdav 2>&1 | tail -40 >&2 || true
            exit 1
          fi

      - name: Run real-server WebDAV integration tests
        env:
          EW_WEBDAV_IT_URL: http://127.0.0.1:6065/
          EW_WEBDAV_IT_USER: ewtest
          EW_WEBDAV_IT_PASSWORD: ewtest
        run: |
          cargo test -p easy-writing-core --test webdav_real_server -- \
            --nocapture --test-threads=1 2>&1 | tee webdav-it.log
          # 凭据不得留在日志里
          if grep -q 'ewtest:ewtest' webdav-it.log; then
            echo "日志中出现明文凭据" >&2
            exit 1
          fi

      - name: Show server logs on failure
        if: failure()
        run: docker logs ew-webdav 2>&1 | tail -60 || true

      - name: Upload integration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webdav-integration-log
          path: webdav-it.log
          if-no-files-found: warn

      - name: Stop WebDAV container
        if: always()
        run: |
          docker rm -f ew-webdav >/dev/null 2>&1 || true
          [ -n "${WEBDAV_WORKDIR:-}" ] && rm -rf "$WEBDAV_WORKDIR" || true


  # V0.3.8 P1-1：性能门禁。
  #
  # 阈值刻意宽松（500ms）。理由：CI runner 的 CPU 与开发机差异很大，
  # 我们没有在 runner 上采集过真实分布，任何更紧的阈值都会产生噪音，
  # 最终导致大家养成忽略红色构建的习惯。
  # 这个门槛只用于拦截「劣化一个数量级」的回归（如误引入 N+1），
  # 精确的性能治理以本机定期跑出的报告为准。
  performance:
    name: 性能门禁（长篇基准）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev build-essential curl wget file

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run long-novel performance benchmarks with gate
        env:
          EW_PERF_GATE_MS: "500"
        run: cargo test -p easy-writing-core --test perf_benchmark -- --ignored --test-threads=1
