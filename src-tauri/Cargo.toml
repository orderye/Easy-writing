[package]
name = "easy-writing-core"
version = "0.3.1"
description = "Easy-writing novel workbench core"
authors = ["Roy"]
edition = "2021"

[lib]
name = "easy_writing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["protocol-asset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled", "backup", "blob"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
uuid = { version = "1.10", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
keyring = "3.2"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1.40", features = ["full"] }
futures-util = "0.3"
sha2 = "0.10"
md-5 = "0.10"
flate2 = "1.0"
base64 = "0.22"
regex = "1.10"
shared-types = { path = "../shared-types" }

[dev-dependencies]
tauri = { version = "2.1", features = ["protocol-asset", "test"] }
