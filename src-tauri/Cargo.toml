[package]
name = "easy-writing-core"
version = "0.3.8"
description = "Easy-writing novel workbench core"
authors = ["Roy"]
edition = "2021"

[lib]
name = "easy_writing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["protocol-asset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled", "backup", "blob"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
uuid = { version = "1.10", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3.2", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1.40", features = ["full"] }
futures-util = "0.3"
sha2 = "0.10"
md-5 = "0.10"
flate2 = "1.0"
base64 = "0.22"
regex = "1.10"
shared-types = { path = "../shared-types" }
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2"] }
# 原生「另存为」对话框。导出路径必须由作者自己选，
# 而 WebView 没有可靠的下载落盘能力。
tauri-plugin-dialog = "2"

[dev-dependencies]
tauri = { version = "2.1", features = ["protocol-asset", "test"] }
